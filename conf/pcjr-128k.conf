# DOSBox-X: IBM PCjr, 128 KB, RGB monitor.
#
# Choplifter! for the IBM PCjr.  Derived from Pungas de Villa Martelli's
# conf/dosbox-x_pcjr.conf in lib/repos/pcjr-flashparty-2018/, cut down to the
# settings that matter and with the memory size corrected to the machine
# DESIGN.md section 2 actually targets.  Theirs sets memsize=16, i.e. 16 MB,
# which is fine for a demo but would hide the entire question M1 exists to
# ask: whether two 16 KB video pages can be had on a 128 KB machine.
#
# READ THIS BEFORE TRUSTING A NUMBER FROM HERE.  DOSBox-X does not model the
# PCjr's memory contention.  On real hardware the Video Gate Array shares main
# memory with the CPU, so a bus cycle takes six clocks instead of four and RAM
# access averages two wait states -- which is the whole reason DESIGN.md
# section 2 predicts only ~680 KB/s for a fill.  Under emulation the fills will
# come out fast and the frame budget will look comfortable.  That tells you the
# code is correct, not that the design is affordable.  See docs/M1.md.

[sdl]
fullscreen  = false
output      = surface

[dosbox]
machine     = pcjr
# 0 MB + 128 KB.  A 128 KB PCjr's BIOS keeps the top 16 KB for the active
# video page and reports 112 KB through int 12h, which is exactly the
# situation DESIGN.md section 3 plans around.  M1 prints what it finds, so if
# DOSBox-X models this differently the report will say so.
memsize     = 0
memsizekb   = 128
# If DOSBox-X refuses to start with 128 KB, use conf/pcjr-dev.conf instead and
# treat the page-allocation part of the M1 report as untested.

[render]
# Mode 8 pixels are about 1.667:1, so aspect correction is what makes the
# screen look like the machine rather than like a stretched bitmap.
aspect      = true
scaler      = normal2x

[cpu]
# normal core, not dynamic: cycle-counted execution is the only thing that
# gives the Zen timer anything sensible to measure.
core        = normal
cputype     = 8086
# 315 cycles/ms is the conventional stand-in for a 4.77 MHz 8088.  It is a
# cycle budget, not a bus model; see the warning above.
cycles      = fixed 315

[speaker]
tandy       = auto
tandyrate   = 44100

[joystick]
joysticktype = 2axis

[autoexec]
mount c: build
c:
echo.
echo Choplifter! PCjr -- M1 video spike, DOSBox-X, 128 KB PCjr.
echo Timings from an emulator are a smoke test only.  See docs/M1.md.
echo.
m1.exe
