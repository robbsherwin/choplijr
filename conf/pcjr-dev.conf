# DOSBox-X: IBM PCjr with a memory sidecar -- the fast iteration config.
#
# Choplifter! for the IBM PCjr.  Use this one while writing code, and
# conf/pcjr-128k.conf when you want the answer to a question.
#
# Sidecar RAM, closer to the jrIDE-class ship machine (DESIGN.md: 640 KB min).
# Port 0x3DF still only selects pages 0-7.  M1 looks for an MCB hole in that
# range (JrConfig 32 KB video reserve), not for a free block above 128 KB.
#
# Everything in pcjr-128k.conf's warning about memory contention applies here
# too, and more so.

[sdl]
fullscreen  = false
output      = surface

[dosbox]
machine     = pcjr
memsize     = 0
memsizekb   = 640

[render]
aspect      = true
scaler      = normal2x

[cpu]
core        = normal
cputype     = 8086
cycles      = fixed 315

[speaker]
tandy       = auto
tandyrate   = 44100

[joystick]
joysticktype = 2axis

[autoexec]
# Attended, same as pcjr-128k.conf: run M1 and stay at the DOS prompt afterwards.
# This machine has sidecar RAM, so the page-allocation half of the report is
# not the 128 KB case DESIGN.md section 3 targets.
mount c: build
c:
echo.
echo Choplifter! PCjr -- M1, DOSBox-X, sidecar (jrIDE-class stand-in).
echo Port 3DF is still pages 0-7 only.  See docs\M1.md.
echo.
m1.exe
