# DOSBox-X: IBM PCjr with a memory sidecar -- the fast iteration config.
#
# Choplifter! for the IBM PCjr.  Use this one while writing code, and
# conf/pcjr-128k.conf when you want the answer to a question.
#
# The difference that matters: this machine has more than 128 KB, so the video
# pages sit in the middle of the DOS memory arena rather than above it, and the
# page-allocation half of M1 is testing a different situation from the one
# DESIGN.md section 3 targets.  M1 detects this from int 12h and says so in its
# report.
#
# Everything in pcjr-128k.conf's warning about memory contention applies here
# too, and more so.

[sdl]
fullscreen  = false
output      = surface

[dosbox]
machine     = pcjr
memsize     = 0
memsizekb   = 640

[render]
aspect      = true
scaler      = normal2x

[cpu]
core        = normal
cputype     = 8086
cycles      = fixed 315

[speaker]
tandy       = auto
tandyrate   = 44100

[joystick]
joysticktype = 2axis

[autoexec]
mount c: build
c:
echo.
echo Choplifter! PCjr -- M1, DOSBox-X, PCjr with a memory sidecar.
echo NOT the 128 KB case.  Use conf\pcjr-128k.conf for that.
echo.
