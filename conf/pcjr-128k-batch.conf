# DOSBox-X: IBM PCjr, 128 KB -- unattended capture.
#
# Choplifter! for the IBM PCjr.  Identical machine to conf/pcjr-128k.conf; the
# only difference is the autoexec, which runs M1 with /batch /nogfx, redirects
# the report to build\M1.LOG and then exits, so nobody has to sit in front of
# it and DOSBox-X closes itself.
#
# Why /nogfx.  M1's visual test exists for a human to judge tearing, strobing
# and which page is on the glass, and it breaks out early only on a keypress.
# In a redirected run there is nobody to look and nobody to press a key, so it
# draws to no one for its full duration and proves nothing.  Run it from
# conf/pcjr-128k.conf, attended, instead.
#
# READ THIS BEFORE TRUSTING A NUMBER FROM HERE.  DOSBox-X does not model the
# PCjr's memory contention.  On real hardware the Video Gate Array shares main
# memory with the CPU, so a bus cycle takes six clocks instead of four and RAM
# access averages two wait states -- which is the whole reason DESIGN.md
# section 2 predicts what it does.  Under emulation the fills come out fast and
# the frame budget looks comfortable.  That tells you the code is correct, not
# that the design is affordable.  See docs/M1.md.

[sdl]
fullscreen  = false
output      = surface

[dosbox]
machine     = pcjr
memsize     = 0
memsizekb   = 128

[render]
aspect      = true
scaler      = normal2x

[cpu]
core        = normal
cputype     = 8086
cycles      = fixed 315

[speaker]
tandy       = auto
tandyrate   = 44100

[joystick]
joysticktype = 2axis

[autoexec]
mount c: build
c:
m1.exe /batch /nogfx > M1.LOG
exit
