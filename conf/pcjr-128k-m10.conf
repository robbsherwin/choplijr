# DOSBox-X: IBM PCjr, RGB monitor.
#
# M10 polish spike, /force for DOSBox model byte.
# Derived from conf/pcjr-128k.conf (machine=pcjr), hence the filename and
# the 128 KB framing in these comments -- but memsizekb below has always
# been 640, matching DESIGN.md's actual ship target (640 KB minimum,
# jrIDE-class; "a 128 KB stock machine is historical analysis, not the
# ship target," DESIGN.md line 8-9). The 128 KB config that filename
# refers to is a separate, deliberate worst-case *gate* test (M1: can two
# video pages still be reserved on a stock box at all?), not this file.
# Left named this way for now since M1's own 128 KB gate config is the
# thing this was cloned from; rename if that stops being confusing.
#
# READ THIS BEFORE TRUSTING A NUMBER FROM HERE.  DOSBox-X does not model the
# PCjr's memory contention.  On real hardware the Video Gate Array shares main
# memory with the CPU, so a bus cycle takes six clocks instead of four and RAM
# access averages two wait states.  Under emulation the frame budget will look
# comfortable.  That tells you the code is correct, not that the design is
# affordable.  See docs/M10.md.
#
# DOSBox does not enforce port 61h bits 5-6 (SN76496 gate).  A pass here is
# not proof the chip is audible on a real PCjr.
#
# NOTE: DOSBox-X rewrites this file into its full, fully-commented form (and
# folds in whatever its currently-loaded settings are, e.g. automount) every
# time it exits, regardless of whether the autoexec below succeeded. That is
# expected -- restore this minimal form afterward rather than treating the
# rewrite as a real edit worth keeping.

[sdl]
fullscreen  = false
output      = surface

[dosbox]
machine     = pcjr
# jrIDE-class ship target (DESIGN.md): 640 KB minimum, typically 736 KB.
memsize     = 0
memsizekb   = 640
# Explicit, not left to inherit: this DOSBox-X install is shared with other
# projects on this machine, and their local dosbox-x.conf has automount=true,
# which DOSBox-X will otherwise fold into this file (it rewrites minimal
# confs into fully-commented ones on load) and then prompt to mount real
# host drives at startup.
automount   = false

[render]
# Mode 8 pixels are about 1.667:1, so aspect correction is what makes the
# screen look like the machine rather than like a stretched bitmap.
aspect      = true
scaler      = normal2x

[cpu]
# normal core, not dynamic: cycle-counted execution is the only thing that
# gives the Zen timer anything sensible to measure.
core        = normal
cputype     = 8086
# 315 cycles/ms is the conventional stand-in for a 4.77 MHz 8088.  It is a
# cycle budget, not a bus model; see the warning above.
cycles      = fixed 315

[speaker]
tandy       = auto
tandyrate   = 44100

[joystick]
joysticktype = 2axis

[autoexec]
# Attended visual/audio run: start M10 with /force (DOSBox-X's model byte is
# not FDh) and do not `exit`.  Esc is the hatch.  See docs/M10.md.
# Absolute path, not "build": DOSBox-X resolves a relative mount target
# against its own program directory (lib\DOSBox-X here), not the OS process's
# working directory, so a relative "build" looked for lib\DOSBox-X\build.
mount c: Y:\github\choplijr\build
c:
echo.
echo Choplifter! PCjr -- M10 polish spike, DOSBox-X.
echo /force because the emulator model byte is not FDh.  See docs/M10.md.
echo Timings from an emulator are a smoke test only.
echo.
m10.exe /force
